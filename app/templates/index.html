<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flight Delay Predictor</title>
  <style>
    :root {
      --bg: #000000;
      --panel: #0f0f0f;
      --card: #111111;
      --text: #f5f5f5;
      --muted: #c0c0c0;
      --accent: #ffffff;
      --border: #1e1e1e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(140deg, #000000 0%, #0d0d0d 45%, #050505 100%);
      color: var(--text);
      font-family: "Inter", "Segoe UI", "Helvetica Neue", sans-serif;
    }
    .container { max-width: 1100px; margin: 36px auto 48px; padding: 0 18px; }
    .header h1 { color: #ffffff; margin: 0 0 10px; letter-spacing: 0.4px; }
    .header p { color: var(--muted); margin: 0 0 18px; max-width: 720px; }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 18px 20px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }
    .upload {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .mode {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      color: var(--text);
      font-size: 0.95rem;
    }
    .mode input[type=radio] {
      accent-color: var(--accent);
      margin-right: 6px;
    }
    .mode input[type=number] {
      width: 110px;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
    }
    input[type=file] {
      color: var(--text);
      background: #0a0a0a;
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      max-width: 420px;
    }
    button {
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      background: var(--text);
      color: #000000;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: none; }
    .alert {
      margin-top: 16px;
      padding: 12px 14px;
      background: #1a1a1a;
      color: #f5f5f5;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .table-wrapper { margin-top: 18px; }
    table { width: 100%; border-collapse: collapse; color: var(--text); }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }
    th { color: #f5f5f5; font-weight: 700; }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .badge.delay { background: #2a0f0f; color: #ff5d5d; border: 1px solid #b00000; }
    .badge.ontime { background: #0f2610; color: #5aff8e; border: 1px solid #0f7d2c; }
    .note { margin-top: 8px; color: var(--muted); font-size: 0.92rem; }
    .pill {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>DIA Flight Delay Predictor</h1>
      <p>Upload a CSV with the feature columns below.</p>
    </div>

    <form method="post" enctype="multipart/form-data">
      <div class="card">
        <label for="csv_file">CSV input</label>
        <div class="upload">
          <input id="csv_file" type="file" name="csv_file" accept=".csv,text/csv" required />
          <button type="submit">Run Predictions</button>
        </div>
        <div class="mode">
          <label><input type="radio" name="mode" value="batch" {% if mode != 'single' %}checked{% endif %}>Predict all rows</label>
          <label><input type="radio" name="mode" value="single" {% if mode == 'single' %}checked{% endif %}>Single row only</label>
          <input type="number" name="row_index" min="1" placeholder="Row #" value="{{ row_index }}">
        </div>
      </div>
    </form>

    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}

    {% if results %}
    <div class="card" style="margin-top:16px;">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Classifier</th>
              <th>Regressed Delay (min)</th>
            </tr>
          </thead>
          <tbody>
            {% for row in results %}
            <tr>
              <td>{{ row.row }}</td>
              <td>
                <span class="badge {{ 'delay' if row.class_label == 'Delay' else 'ontime' }}">{{ row.class_label }}</span>
              </td>
              <td>{{ row.delay_minutes | round(2) }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
    {% endif %}
  </div>
</body>
</html>
